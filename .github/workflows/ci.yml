name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy:
      matrix: {os: [windows-latest, ubuntu-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.11', enable-cache: true}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/track_it
      - run: uv run pytest --cov=track_it --cov-report=xml
        env: {QT_QPA_PLATFORM: offscreen}
