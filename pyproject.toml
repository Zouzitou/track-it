[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "track-it"
version = "0.1.0a1"
description = "Free, local, open-source AI video object masking and motion tracking."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "zouzitou" }]
keywords = ["video-segmentation", "motion-tracking", "rotoscoping", "sam2", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PySide6>=6.8,<7", "torch>=2.12,<2.13", "torchvision>=0.27,<0.28",
  "numpy>=1.26.4,<2.1", "scipy>=1.12,<2", "Pillow>=10,<13", "av>=12,<17",
  "pydantic>=2.7,<3", "platformdirs>=4,<5", "httpx>=0.27,<1",
  "filelock>=3.15,<4", "psutil>=5.9,<8", "packaging>=26.2,<27",
  "huggingface-hub>=0.24,<2", "safetensors>=0.4,<1", "einops>=0.8,<1",
  "hydra-core>=1.3,<2", "omegaconf>=2.3,<3", "tqdm>=4.66,<5",
  "zstandard>=0.22,<1", "xxhash>=3.4,<4", "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10", "pytest-qt>=4.4,<5", "pytest-cov>=6,<8",
  "pytest-timeout>=2.3,<3", "ruff>=0.11,<1", "mypy>=1.15,<2",
  "pre-commit>=4,<5", "pip-audit>=2.8,<3", "pip-licenses>=5,<6",
  "cyclonedx-bom>=5,<6", "types-Pillow>=10,<13", "types-psutil>=7,<8",
  "Nuitka>=2.7,<3", "ordered-set>=4.1,<5",
]

[project.scripts]
TrackIt = "track_it.cli:main"
track-it = "track_it.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/track_it"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", ".uv-cache", ".tmp", ".tmp-upstream", "build", "dist", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["type-arg"]
packages = ["track_it"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["av.*", "scipy.*", "zstandard.*", "sam2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --timeout=30"
testpaths = ["tests"]
markers = ["integration: integration tests", "ui: Qt UI tests", "sam2: real SAM 2 test"]

[tool.coverage.run]
source = ["track_it"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
