name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  test:
    strategy:
      matrix: {os: [windows-latest, ubuntu-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: {python-version: '3.11', enable-cache: true}
      - name: Install Linux media and Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
      - name: Install macOS media runtime
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows media runtime
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/track_it
      - run: uv run pytest --cov=track_it --cov-report=xml
        env: {QT_QPA_PLATFORM: offscreen}
